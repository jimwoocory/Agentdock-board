[project]
name = "agentdock-board"
version = "2.0.0"
description = "Persistent realtime task board for AgentDock/Harness/Hermes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "mcp>=1.28,<2",
]

[project.scripts]
agentdock-board = "agentdock_board.main:run"
agentdock-board-mcp = "agentdock_board.mcp_server:run"
agentdock-board-mcp-http = "agentdock_board.mcp_server:run_http"
agentdock-board-chatgpt-app = "agentdock_board.chatgpt_app:run_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdock_board"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
