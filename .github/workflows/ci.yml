name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Ruff correctness
        run: ruff check --select E,F src tests scripts
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts -Filter *.ps1
          foreach ($file in $files) {
            [scriptblock]::Create((Get-Content $file.FullName -Raw)) | Out-Null
            Write-Host "syntax ok: $($file.Name)"
          }
      - name: Pytest
        run: pytest -q
